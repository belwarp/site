<!DOCTYPE html>
<html lang="en">
<head>
  <title>BELWARP Vol.01 — Kayla Painter & more - 5 September 2026</title>
  <meta
    name="description"
    content="BELWARP Vol.01 — a curated evening of experimental music, live performance and audiovisual work. Featuring Kayla Painter and more. Kirkgate Centre, Shipley — 5 September."
  />

  <!-- Open Graph -->
  <meta property="og:title" content="BELWARP Vol.01"/>
  <meta
    property="og:description"
    content="Experimental music, live performance and audiovisual work. Featuring Kayla Painter and more — 5 September."
  />
  <meta property="og:image" content="https://belwarp.com/img/poster.jpg"/>
  <meta property="og:url" content="https://belwarp.com"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="BELWARP"/>

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="BELWARP Vol.01"/>
  <meta
    name="twitter:description"
    content="Experimental music, live performance and audiovisual work — 5 September."
  />
  <meta name="twitter:image" content="https://belwarp.com/img/poster.jpg"/>

  <!-- Theme -->
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="BELWARP"/>

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/site.webmanifest"/>

  <style>
    :root {
      --text: #111;
      --bg: #ffffff;
      --button-bg: #e8e8e8;
      --border: #111;
      --muted: #666;
      --max-width: 640px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }

    .poster {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }

    .poster img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      display: block;
    }

    .actions {
      width: 100%;
      max-width: var(--max-width);
      margin: 32px auto 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .button,
    #mc_embed_signup #mc-embedded-subscribe {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 22px;
      background: var(--button-bg);
      color: var(--text);
      border: 0;
      border-radius: 4px;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .button:hover,
    #mc_embed_signup #mc-embedded-subscribe:hover {
      background: #fff;
    }

    .mailing-form {
      width: 100%;
      max-width: 320px;
      margin: 0;
    }

    .mail-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .mail-input,
    .mail-submit {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 4px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .mail-input {
      background: rgba(255,255,255,0.92);
      color: #111;
      border: none;
      text-align: center;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .mail-input::placeholder {
      color: #666;
    }

    .mail-input:focus {
      outline: none;
    }

    .mail-submit {
      background: rgba(255,255,255,0.94);
      color: #111;
      border: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    #mc_embed_signup h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .button,
    .mail-submit {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      outline: none;
      box-shadow: none;
    }

    .button:focus,
    .mail-submit:focus,
    .mail-input:focus {
      outline: none;
      box-shadow: none;
    }

    #mc_embed_signup_scroll {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #mc_embed_signup .mc-field-group {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #mc_embed_signup label {
      display: none;
    }

    #mc_embed_signup input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font: inherit;
    }

    #mc_embed_signup input[type="email"]::placeholder {
      color: rgba(255,255,255,0.6);
    }

    #mc_embed_signup input[type="email"]:focus {
      outline: none;
      border-color: #fff;
    }

    #mc_embed_signup input[type="submit"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.92);
      color: #000;
      border: none;
      border-radius: 4px;
      font: inherit;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      width: min(80vw, 420px);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;

      background: transparent;
      padding: 0;
      border-radius: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .meta {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
    }

    .meta h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .meta p {
      margin: 6px 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page {
        padding: 16px 12px 48px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        align-items: center;
      }

      .button {
        width: 100%;
        max-width: 320px;
        min-height: 48px;
        padding: 12px 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(255,255,255,0.94);
        color: #111;
        text-decoration: none;
        border: none;
        border-radius: 4px;

        font: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;

        cursor: pointer;
      }

      #mc_embed_signup form {
        width: 100%;
        margin: 0;
      }

      #mc_embed_signup_scroll {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .meta h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
<div class="poster-wrap">
  <div class="poster">
    <img src="img/poster.png"
         alt="BELWARP event poster, depicting an industrial scene, with the caption BELWARP - vol.1 - Experimental Electronic Music - featuring an all-women lineup - September 2026 - Kirkgate Community Centre, Shipley">
  </div>

  <div class="overlay">
    <div class="actions">
<!--      <a class="button" href="https://www.tickettailor.com/events/TBC" target="_blank">Tickets</a>-->
      <a class="button" href="https://instagram.com/bel.warp" target="_blank">Instagram</a>
    </div>

    <form
      class="mailing-form"
      action="https://belwarp.us9.list-manage.com/subscribe/post?u=7ff53a6043e3861f8cd7824f3&amp;id=a12aefc4b1&amp;f_id=00f6d5e3f0"
      method="post"
      target="_blank"
      novalidate
    >
      <div class="mail-row">
        <label for="mce-EMAIL" style="position:absolute;left:-9999px;">Email address</label>
        <input
          class="mail-input"
          type="email"
          name="EMAIL"
          id="mce-EMAIL"
          placeholder="Join mailing list"
          required
        />
        <input
          class="mail-submit"
          type="submit"
          value="Join"
        />
      </div>

      <div style="position:absolute; left:-5000px;" aria-hidden="true">
        <input
          type="text"
          name="b_7ff53a6043e3861f8cd7824f3_a12aefc4b1"
          tabindex="-1"
          value=""
        />
      </div>
    </form>
  </div>
</div>
</body>
</html>
