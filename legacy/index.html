    content="Experimental music, live performance and audiovisual work — 5 September."

  <!-- Theme -->
  <meta name="theme-color" content="#000000"/>

  <meta name="apple-mobile-web-app-title" content="BELWARP"/>

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico"/>

  <link rel="manifest" href="/site.webmanifest"/>

  <style>
    :root {
      --text: #111;
      --bg: #ffffff;
      --border: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .poster-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .poster {
      position: relative;
      display: inline-block;
    }

    .poster img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: min(80vw, 420px);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;

      background: transparent;
      padding: 0;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      align-items: center;
      margin: 0;
    }

    .button {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.94);
      color: #111;
      text-decoration: none;
      border: none;
      border-radius: 4px;

      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;

      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: none;
      outline: none;
    }

    .button:hover,
    .button:focus {
      background: #fff;
      color: #111;
      text-decoration: none;
      box-shadow: none;
      outline: none;
    }

    .mailing-form {
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .mail-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .mail-input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      border: none;
      border-radius: 4px;
      text-align: center;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.2px;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: none;
    }

    .mail-input::placeholder {
      color: #666;
    }

    .mail-input:focus {
      outline: none;
      box-shadow: none;
    }

    @media (max-width: 640px) and (orientation: portrait) {
      .poster img {
        width: 100vw;
        height: auto;
        max-height: none;
      }

      .overlay {
        top: 75%;
        width: min(84vw, 360px);
        gap: 8px;
      }

      .button,
      .mail-input {
        min-height: 50px;
        font-size: 15px;
        padding: 12px 16px;
      }

      .actions {
        gap: 10px;
      }

      .mail-row {
        gap: 8px;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      .poster img {
        max-height: 100vh;
        width: auto;
      }

      .overlay {
        top: 75%;
        width: 320px;
        gap: 6px;
      }

      .button,
      .mail-input {
        min-height: 42px;
        font-size: 13px;
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>
<div class="poster-wrap">
  <div class="poster">
    <img src="img/poster.png"
         alt="BELWARP event poster, depicting an industrial scene, with the caption BELWARP - vol.1 - Experimental Electronic Music - featuring an all-women lineup - September 2026 - Kirkgate Community Centre, Shipley">

    <div class="overlay">
      <div class="actions">
        <a class="button" href="https://app.tickettailor.com/events/belwarp/2156085" target="_blank">Buy Tickets</a>
        <a class="button" href="https://instagram.com/bel.warp" target="_blank">Instagram</a>
      </div>

      <form
        class="mailing-form"
        action="https://belwarp.us9.list-manage.com/subscribe/post?u=7ff53a6043e3861f8cd7824f3&amp;id=a12aefc4b1&amp;f_id=00f6d5e3f0"
        method="post"
        target="_blank"
        novalidate
      >
        <div class="mail-row">
          <label for="mce-EMAIL" style="position:absolute;left:-9999px;">Email address</label>
          <input
            class="mail-input"
            type="email"
            name="EMAIL"
            id="mce-EMAIL"
            placeholder="<Your email here>"
            required
          />
          <input
            class="button"
            type="submit"
            value="Join our mailing list"
          />
        </div>

        <div style="position:absolute; left:-5000px;" aria-hidden="true">
          <input
            type="text"
            name="b_7ff53a6043e3861f8cd7824f3_a12aefc4b1"
            tabindex="-1"
            value=""
          />
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
